# Promtail configuration: two sources, both versioned here.
#
#   docker-containers  all containers on this Docker daemon, discovered through the socket
#                      and labelled with their compose service/project
#   lab-files          the synthetic target's JSON log file, parsed with a json stage so
#                      the fields are queryable in Loki instead of being one blob
#
# promtail validates this file with -check-syntax: the same command backs the container
# healthcheck, so a broken config makes the container unhealthy instead of silently
# shipping nothing.

server:
  http_listen_port: 9080
  grpc_listen_port: 0
  log_level: info

positions:
  filename: /var/lib/promtail/positions.yaml

clients:
  - url: http://loki:3100/loki/api/v1/push
    backoff_config:
      min_period: 500ms
      max_period: 5m
      max_retries: 10
    batchwait: 1s
    batchsize: 1048576

scrape_configs:
  - job_name: docker-containers
    docker_sd_configs:
      - host: unix:///var/run/docker.sock
        refresh_interval: 15s
    relabel_configs:
      - source_labels: ["__meta_docker_container_name"]
        regex: "/(.*)"
        target_label: container
      - source_labels: ["__meta_docker_container_log_stream"]
        target_label: stream
      - source_labels: ["__meta_docker_container_label_com_docker_compose_service"]
        target_label: service
      - source_labels: ["__meta_docker_container_label_com_docker_compose_project"]
        target_label: project
      - target_label: job
        replacement: docker-containers
      - target_label: instance
        replacement: lab-node-01
    pipeline_stages:
      # Container logs arrive as Docker's JSON envelope: unwrap it, keep the message.
      - docker: {}

  - job_name: lab-files
    static_configs:
      - targets: [localhost]
        labels:
          job: lab-files
          instance: lab-node-01
          service: synthetic-target
          __path__: /var/log/lab/*.log
    pipeline_stages:
      - json:
          expressions:
            level: level
            logger: logger
            msg: msg
            path: path
            status: status
            duration_ms: duration_ms
            client: client
      - labels:
          level:
          logger:
      - timestamp:
          source: time
          format: RFC3339Nano
      - output:
          source: msg

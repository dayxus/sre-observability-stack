name: maintenance

on:
  schedule:
    # Monday 06:17 UTC: pins are checked before the working week starts.
    - cron: "17 6 * * 1"
  workflow_dispatch:

permissions:
  contents: write
  issues: write

env:
  PYTHONUNBUFFERED: "1"

jobs:
  weekly-audit:
    name: weekly version and rules audit
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: audit upstream component versions against versions.env
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python3 scripts/audit_versions.py

      - name: summarize drift and prepare the issue body
        id: drift
        run: |
          python3 - <<'PY'
          import json
          import os
          import pathlib

          summary = json.loads(pathlib.Path(".audit/summary.json").read_text(encoding="utf-8"))
          drift = summary["drift"]
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as handle:
              for level, names in drift.items():
                  handle.write(f"{level}={','.join(names)}\n")

          lines = [
              "The weekly audit found components whose pinned version is behind upstream.",
              "",
              "| Component | Pinned | Latest stable | Drift | Changelog |",
              "| --- | --- | --- | --- | --- |",
          ]
          for component in summary["components"]:
              if component["drift"] == "up_to_date":
                  continue
              lines.append(
                  "| {name} | `{pinned}` | `{latest}` | {drift} | [changelog]({changelog}) |".format(**component)
              )
          lines += [
              "",
              "Generated by `.github/workflows/maintenance.yml`; the full audit is in "
              "[`reports/weekly-audit.md`](../blob/main/reports/weekly-audit.md).",
              "",
              "Before merging a bump: edit `versions.env`, run `scripts/validate.sh`, and let the "
              "`smoke` job in CI bring the stack up — a major release of Prometheus, Grafana or Loki "
              "changes configuration semantics, which is why this is an issue and not an automatic commit.",
          ]
          pathlib.Path(".audit/issue-drift.md").write_text("\n".join(lines) + "\n", encoding="utf-8")
          print(f"drift: {drift}")
          PY

      - name: re-check the rules with the newest published promtool
        id: rules
        run: |
          set -u
          latest="$(python3 -c "import json,pathlib; s=json.loads(pathlib.Path('.audit/summary.json').read_text()); print(next(c['latest'] for c in s['components'] if c['name']=='Prometheus'))")"
          bare="${latest#v}"
          archive="prometheus-${bare}.linux-amd64.tar.gz"
          echo "newest stable prometheus: ${latest}"
          if ! curl -fsSL -o "/tmp/${archive}" \
            "https://github.com/prometheus/prometheus/releases/download/${latest}/${archive}"; then
            echo "the release asset ${archive} could not be downloaded" > .audit/promtool-error.txt
            echo "failed=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          tar -xzf "/tmp/${archive}" -C /tmp "prometheus-${bare}.linux-amd64/promtool"
          "/tmp/prometheus-${bare}.linux-amd64/promtool" --version | head -1
          if "/tmp/prometheus-${bare}.linux-amd64/promtool" check rules prometheus/rules/*.rules.yml \
            >/tmp/promtool.out 2>/tmp/promtool.err; then
            echo "the repository's rules pass the newest promtool"
            cat /tmp/promtool.out
          else
            echo "failed=true" >> "$GITHUB_OUTPUT"
            {
              echo "The rule files in \`prometheus/rules/\` fail \`promtool check rules\` on the newest stable prometheus release (${latest})."
              echo
              echo "The versions pinned in \`versions.env\` are still validated by the \`validate\` job in CI: this is a forward-looking check, so a red result here means the next upgrade needs work, not that the repository is broken today."
              echo
              echo '```'
              cat /tmp/promtool.err /tmp/promtool.out
              echo '```'
            } > .audit/issue-promtool.md
            cat /tmp/promtool.err
            exit 0
          fi

      - name: commit the refreshed version table and audit report
        run: |
          git config user.name "Jeferson Melo"
          git config user.email "161839842+dayxus@users.noreply.github.com"
          git add docs/versions.md reports/weekly-audit.md
          if git diff --cached --quiet; then
            echo "nothing to commit: the reports are unchanged"
            exit 0
          fi
          git commit -m "chore(deps): sync component versions"
          git push

      - name: open an issue when a major upgrade is available
        if: steps.drift.outputs.major != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh issue create \
            --title "Major component upgrade available: ${{ steps.drift.outputs.major }}" \
            --body-file .audit/issue-drift.md

      - name: open an issue when the rules fail the newest promtool
        if: steps.rules.outputs.failed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ -f .audit/issue-promtool.md ]; then
            body=".audit/issue-promtool.md"
          else
            printf 'The newest promtool could not be downloaded.\n\n```\n%s\n```\n' \
              "$(cat .audit/promtool-error.txt 2>/dev/null)" > .audit/issue-download.md
            body=".audit/issue-download.md"
          fi
          gh issue create --title "promtool check rules fails against the newest stable release" --body-file "$body"

      - name: upload the audit artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: weekly-audit
          path: |
            .audit/summary.json
            reports/weekly-audit.md
            docs/versions.md
          if-no-files-found: ignore
